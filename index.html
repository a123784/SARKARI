    notice: ["This site only gives information. Apply only on the official portal. Rules and amounts may change, so confirm there first.","यह साइट केवल जानकारी देती है। आवेदन केवल आधिकारिक पोर्टल पर करें। नियम और राशि बदल सकते हैं, पहले वहाँ पुष्टि करें।","ही साइट फक्त माहिती देते. अर्ज फक्त अधिकृत पोर्टलवर करा. नियम व रक्कम बदलू शकतात, आधी तिथे खात्री करा.","এই সাইট শুধু তথ্য দেয়। আবেদন শুধু সরকারি পোর্টালে করুন। নিয়ম ও অর্থের পরিমাণ বদলাতে পারে, আগে সেখানে যাচাই করুন।","இந்த தளம் தகவல் மட்டுமே தருகிறது. அதிகாரப்பூர்வ தளத்தில் மட்டுமே விண்ணப்பிக்கவும். விதிகள் மாறலாம், முதலில் அங்கே உறுதிசெய்யவும்.","ఈ సైట్ సమాచారం మాత్రమే ఇస్తుంది. అధికారిక పోర్టల్‌లో మాత్రమే దరఖాస్తు చేయండి. నియమాలు మారవచ్చు, ముందు అక్కడ నిర్ధారించుకోండి.","આ સાઇટ ફક્ત માહિતી આપે છે. અરજી ફક્ત સત્તાવાર પોર્ટલ પર કરો. નિયમો અને રકમ બદલાઈ શકે છે, પહેલા ત્યાં ખાતરી કરો.","ಈ ಸೈಟ್ ಮಾಹಿತಿ ಮಾತ್ರ ನೀಡುತ್ತದೆ. ಅಧಿಕೃತ ಪೋರ್ಟಲ್‌ನಲ್ಲಿ ಮಾತ್ರ ಅರ್ಜಿ ಸಲ್ಲಿಸಿ. ನಿಯಮಗಳು ಬದಲಾಗಬಹುದು, ಮೊದಲು ಅಲ್ಲಿ ಖಚಿತಪಡಿಸಿಕೊಳ್ಳಿ.","ഈ സൈറ്റ് വിവരങ്ങൾ മാത്രമാണ് നൽകുന്നത്. ഔദ്യോഗിക പോർട്ടലിൽ മാത്രം അപേക്ഷിക്കുക. നിയമങ്ങൾ മാറാം, ആദ്യം അവിടെ ഉറപ്പാക്കുക.","ਇਹ ਸਾਈਟ ਸਿਰਫ਼ ਜਾਣਕਾਰੀ ਦਿੰਦੀ ਹੈ। ਅਰਜ਼ੀ ਸਿਰਫ਼ ਅਧਿਕਾਰਤ ਪੋਰਟਲ 'ਤੇ ਦਿਓ। ਨਿਯਮ ਅਤੇ ਰਕਮ ਬਦਲ ਸਕਦੇ ਹਨ, ਪਹਿਲਾਂ ਉੱਥੇ ਪੁਸ਼ਟੀ ਕਰੋ।"],
    footer: ["Independent informational website, not affiliated with any government department.","स्वतंत्र जानकारी वेबसाइट, किसी सरकारी विभाग से संबद्ध नहीं।","स्वतंत्र माहिती वेबसाइट, कोणत्याही सरकारी विभागाशी संलग्न नाही.","স্বতন্ত্র তথ্য ওয়েবসাইট, কোনো সরকারি দপ্তরের সঙ্গে যুক্ত নয়।","சுயாதீன தகவல் இணையதளம், எந்த அரசுத் துறையுடனும் தொடர்பில்லாதது.","స్వతంత్ర సమాచార వెబ్‌సైట్, ఏ ప్రభుత్వ శాఖతోనూ సంబంధం లేదు.","સ્વતંત્ર માહિતી વેબસાઇટ, કોઈ સરકારી વિભાગ સાથે સંકળાયેલી નથી.","ಸ್ವತಂತ್ರ ಮಾಹಿತಿ ವೆಬ್‌ಸೈಟ್, ಯಾವುದೇ ಸರ್ಕಾರಿ ಇಲಾಖೆಯೊಂದಿಗೆ ಸಂಬಂಧವಿಲ್ಲ.","സ്വതന്ത്ര വിവര വെബ്‌സൈറ്റ്, ഒരു സർക്കാർ വകുപ്പുമായും ബന്ധമില്ല.","ਸੁਤੰਤਰ ਜਾਣਕਾਰੀ ਵੈੱਬਸਾਈਟ, ਕਿਸੇ ਸਰਕਾਰੀ ਵਿਭਾਗ ਨਾਲ ਸੰਬੰਧਿਤ ਨਹੀਂ।"]

    { name:"PM-KISAN", cat:"farmers", st:"all", link:"https://pmkisan.gov.in/",
      d:["aadhaar","bank","land","mobile"],
      b:["Direct cash support credited to the farmer's bank account in instalments every year.","हर साल किश्तों में किसान के बैंक खाते में सीधी नकद सहायता।","दरवर्षी हप्त्यांमध्ये शेतकऱ्याच्या बँक खात्यात थेट रोख मदत.","প্রতি বছর কিস্তিতে কৃষকের ব্যাংক অ্যাকাউন্টে সরাসরি নগদ সহায়তা।","ஆண்டுதோறும் தவணைகளில் விவசாயியின் வங்கிக் கணக்கில் நேரடி பண உதவி.","ప్రతి సంవత్సరం వాయిదాల్లో రైతు బ్యాంక్ ఖాతాలో నేరుగా నగదు సాయం.","દર વર્ષે હપ્તામાં ખેડૂતના બેંક ખાતામાં સીધી રોકડ સહાય.","ಪ್ರತಿ ವರ್ಷ ಕಂತುಗಳಲ್ಲಿ ರೈತನ ಬ್ಯಾಂಕ್ ಖಾತೆಗೆ ನೇರ ನಗದು ನೆರವು.","എല്ലാ വർഷവും ഗഡുക്കളായി കർഷകന്റെ ബാങ്ക് അക്കൗണ്ടിൽ നേരിട്ട് പണസഹായം.","ਹਰ ਸਾਲ ਕਿਸ਼ਤਾਂ ਵਿੱਚ ਕਿਸਾਨ ਦੇ ਬੈਂਕ ਖਾਤੇ ਵਿੱਚ ਸਿੱਧੀ ਨਕਦ ਸਹਾਇਤਾ।"],
      e:["Landholding farmer families (some exclusions apply).","भूमिधारक किसान परिवार (कुछ अपवाद लागू)।","जमीनधारक शेतकरी कुटुंबे (काही अपवाद लागू).","জমির মালিক কৃষক পরিবার (কিছু ব্যতিক্রম প্রযোজ্য)।","நிலம் உள்ள விவசாயக் குடும்பங்கள் (சில விலக்குகள் உண்டு).","భూమి ఉన్న రైతు కుటుంబాలు (కొన్ని మినహాయింపులు ఉన్నాయి).","જમીન ધરાવતા ખેડૂત પરિવારો (કેટલાક અપવાદ લાગુ).","ಜಮೀನು ಹೊಂದಿರುವ ರೈತ ಕುಟುಂಬಗಳು (ಕೆಲವು ಹೊರತುಪಡಿಸಿ).","ഭൂമിയുള്ള കർഷക കുടുംബങ്ങൾ (ചില ഒഴിവാക്കലുകൾ ബാധകം).","ਜ਼ਮੀਨ ਵਾਲੇ ਕਿਸਾਨ ਪਰਿਵਾਰ (ਕੁਝ ਅਪਵਾਦ ਲਾਗੂ)।"] },

    { name:"Ayushman Bharat (PM-JAY)", cat:"health", st:"all", link:"https://pmjay.gov.in/",
      d:["aadhaar","ration","address","mobile"],
      b:["Cashless treatment in empanelled hospitals for listed procedures, with a yearly health cover for the family.","सूचीबद्ध अस्पतालों में तय इलाज के लिए कैशलेस उपचार, परिवार के लिए सालाना स्वास्थ्य कवर।","सूचीबद्ध रुग्णालयांत ठरावीक उपचारांसाठी कॅशलेस सुविधा, कुटुंबासाठी वार्षिक आरोग्य संरक्षण.","তালিকাভুক্ত হাসপাতালে নির্দিষ্ট চিকিৎসায় নগদহীন সুবিধা, পরিবারের জন্য বার্ষিক স্বাস্থ্য কভার।","பட்டியலிடப்பட்ட மருத்துவமனைகளில் குறிப்பிட்ட சிகிச்சைகளுக்குப் பணமில்லா வசதி, குடும்பத்துக்கு ஆண்டுக் காப்பீடு.","జాబితాలోని ఆసుపత్రుల్లో నిర్దేశిత చికిత్సలకు నగదు రహిత సౌకర్యం, కుటుంబానికి వార్షిక ఆరోగ్య కవరేజ్.","યાદીમાંની હોસ્પિટલોમાં નક્કી કરેલી સારવાર માટે કેશલેસ સુવિધા, પરિવાર માટે વાર્ષિક આરોગ્ય કવર.","ಪಟ್ಟಿಯಲ್ಲಿರುವ ಆಸ್ಪತ್ರೆಗಳಲ್ಲಿ ನಿಗದಿತ ಚಿಕಿತ್ಸೆಗೆ ನಗದು ರಹಿತ ಸೌಲಭ್ಯ, ಕುಟುಂಬಕ್ಕೆ ವಾರ್ಷಿಕ ಆರೋಗ್ಯ ರಕ್ಷಣೆ.","പട്ടികയിലുള്ള ആശുപത്രികളിൽ നിശ്ചിത ചികിത്സകൾക്ക് പണരഹിത സൗകര്യം, കുടുംബത്തിന് വാർഷിക ആരോഗ്യ പരിരക്ഷ.","ਸੂਚੀਬੱਧ ਹਸਪਤਾਲਾਂ ਵਿੱਚ ਤੈਅ ਇਲਾਜ ਲਈ ਕੈਸ਼ਲੈੱਸ ਸਹੂਲਤ, ਪਰਿਵਾਰ ਲਈ ਸਾਲਾਨਾ ਸਿਹਤ ਕਵਰ।"],
      e:["Families selected by SECC data / state criteria.","SECC डेटा / राज्य मानदंड से चुने गए परिवार।","SECC डेटा / राज्याच्या निकषांनुसार निवडलेली कुटुंबे.","SECC তথ্য / রাজ্যের মানদণ্ডে নির্বাচিত পরিবার।","SECC தரவு / மாநில அளவுகோல்படி தேர்ந்தெடுக்கப்பட்ட குடும்பங்கள்.","SECC డేటా / రాష్ట్ర ప్రమాణాల ప్రకారం ఎంపికైన కుటుంబాలు.","SECC ડેટા / રાજ્યના માપદંડથી પસંદ થયેલા પરિવારો.","SECC ಡೇಟಾ / ರಾಜ್ಯದ ಮಾನದಂಡದಿಂದ ಆಯ್ಕೆಯಾದ ಕುಟುಂಬಗಳು.","SECC ഡാറ്റ / സംസ്ഥാന മാനദണ്ഡം അനുസരിച്ച് തിരഞ്ഞെടുത്ത കുടുംബങ്ങൾ.","SECC ਡੇਟਾ / ਰਾਜ ਦੇ ਮਾਪਦੰਡ ਅਨੁਸਾਰ ਚੁਣੇ ਪਰਿਵਾਰ।"] },

    { name:"PM Awas Yojana (Urban)", cat:"housing", st:"all", link:"https://pmaymis.gov.in/",
      d:["aadhaar","income","bank","address"],
      b:["Subsidy or financial help to build or buy a pucca house.","पक्का घर बनाने या खरीदने के लिए सब्सिडी या आर्थिक सहायता।","पक्के घर बांधण्यासाठी किंवा घेण्यासाठी अनुदान किंवा आर्थिक मदत.","পাকা বাড়ি তৈরি বা কেনার জন্য ভর্তুকি বা আর্থিক সহায়তা।","பக்கா வீடு கட்ட அல்லது வாங்க மானியம் அல்லது நிதி உதவி.","పక్కా ఇల్లు కట్టడానికి లేదా కొనడానికి సబ్సిడీ లేదా ఆర్థిక సాయం.","પાકું ઘર બાંધવા કે ખરીદવા માટે સબસિડી અથવા આર્થિક મદદ.","ಪಕ್ಕಾ ಮನೆ ಕಟ್ಟಲು ಅಥವಾ ಖರೀದಿಸಲು ಸಬ್ಸಿಡಿ ಅಥವಾ ಆರ್ಥಿಕ ನೆರವು.","പക്കാ വീട് പണിയാനോ വാങ്ങാനോ സബ്സിഡിയോ സാമ്പത്തിക സഹായമോ.","ਪੱਕਾ ਘਰ ਬਣਾਉਣ ਜਾਂ ਖਰੀਦਣ ਲਈ ਸਬਸਿਡੀ ਜਾਂ ਆਰਥਿਕ ਮਦਦ।"],
      e:["EWS / LIG / MIG families without a pucca house.","पक्का घर न रखने वाले EWS / LIG / MIG परिवार।","पक्के घर नसलेली EWS / LIG / MIG कुटुंबे.","পাকা বাড়ি নেই এমন EWS / LIG / MIG পরিবার।","பக்கா வீடு இல்லாத EWS / LIG / MIG குடும்பங்கள்.","పక్కా ఇల్లు లేని EWS / LIG / MIG కుటుంబాలు.","પાકું ઘર ન ધરાવતા EWS / LIG / MIG પરિવારો.","ಪಕ್ಕಾ ಮನೆ ಇಲ್ಲದ EWS / LIG / MIG ಕುಟುಂಬಗಳು.","പക്കാ വീടില്ലാത്ത EWS / LIG / MIG കുടുംബങ്ങൾ.","ਪੱਕਾ ਘਰ ਨਾ ਰੱਖਣ ਵਾਲੇ EWS / LIG / MIG ਪਰਿਵਾਰ।"] },

    { name:"PM Ujjwala Yojana", cat:"women", st:"all", link:"https://www.pmuy.gov.in/",
      d:["aadhaar","ration","bank","photo","address"],
      b:["Help in getting a new LPG connection for cleaner and safer cooking.","साफ और सुरक्षित खाना पकाने के लिए नया LPG कनेक्शन पाने में सहायता।","स्वच्छ व सुरक्षित स्वयंपाकासाठी नवीन LPG जोडणी मिळवण्यास मदत.","পরিষ্কার ও নিরাপদ রান্নার জন্য নতুন LPG সংযোগ পেতে সহায়তা।","சுத்தமான, பாதுகாப்பான சமையலுக்குப் புதிய LPG இணைப்பு பெற உதவி.","శుభ్రమైన, సురక్షితమైన వంట కోసం కొత్త LPG కనెక్షన్ పొందడంలో సాయం.","સ્વચ્છ અને સલામત રસોઈ માટે નવું LPG કનેક્શન મેળવવામાં મદદ.","ಸ್ವಚ್ಛ ಮತ್ತು ಸುರಕ್ಷಿತ ಅಡುಗೆಗಾಗಿ ಹೊಸ LPG ಸಂಪರ್ಕ ಪಡೆಯಲು ನೆರವು.","ശുദ്ധവും സുരക്ഷിതവുമായ പാചകത്തിന് പുതിയ LPG കണക്ഷൻ ലഭിക്കാൻ സഹായം.","ਸਾਫ਼ ਅਤੇ ਸੁਰੱਖਿਅਤ ਖਾਣਾ ਪਕਾਉਣ ਲਈ ਨਵਾਂ LPG ਕਨੈਕਸ਼ਨ ਲੈਣ ਵਿੱਚ ਮਦਦ।"],
      e:["Adult woman from a BPL household.","BPL परिवार की वयस्क महिला।","BPL कुटुंबातील प्रौढ महिला.","BPL পরিবারের প্রাপ্তবয়স্ক মহিলা।","BPL குடும்பத்தைச் சேர்ந்த வயது வந்த பெண்.","BPL కుటుంబానికి చెందిన వయోజన మహిళ.","BPL પરિવારની પુખ્ત મહિલા.","BPL ಕುಟುಂಬದ ವಯಸ್ಕ ಮಹಿಳೆ.","BPL കുടുംബത്തിലെ പ്രായപൂർത്തിയായ സ്ത്രീ.","BPL ਪਰਿਵਾਰ ਦੀ ਬਾਲਗ ਔਰਤ।"] },

    { name:"PM Mudra Yojana", cat:"business", st:"all", link:"https://www.mudra.org.in/",
      d:["aadhaar","pan","business","bank","address"],
      b:["Collateral-free loans in Shishu, Kishore and Tarun categories for small business needs.","छोटे व्यापार की जरूरतों के लिए शिशु, किशोर और तरुण श्रेणी में बिना गारंटी ऋण।","लहान व्यवसायाच्या गरजांसाठी शिशु, किशोर व तरुण श्रेणीत तारणमुक्त कर्ज.","ছোট ব্যবসার প্রয়োজনে শিশু, কিশোর ও তরুণ বিভাগে জামানতহীন ঋণ।","சிறு தொழில் தேவைகளுக்கு சிசு, கிஷோர், தருண் பிரிவுகளில் ஈடு இல்லாத கடன்.","చిన్న వ్యాపార అవసరాలకు శిశు, కిశోర్, తరుణ్ విభాగాల్లో పూచీకత్తు లేని రుణాలు.","નાના વ્યવસાયની જરૂરિયાતો માટે શિશુ, કિશોર અને તરુણ શ્રેણીમાં તારણ વગરની લોન.","ಸಣ್ಣ ವ್ಯಾಪಾರದ ಅಗತ್ಯಗಳಿಗೆ ಶಿಶು, ಕಿಶೋರ್, ತರುಣ್ ವರ್ಗಗಳಲ್ಲಿ ಜಾಮೀನು ರಹಿತ ಸಾಲ.","ചെറുകിട ബിസിനസ് ആവശ്യങ്ങൾക്ക് ശിശു, കിശോർ, തരുൺ വിഭാഗങ്ങളിൽ ഈടില്ലാത്ത വായ്പ.","ਛੋਟੇ ਕਾਰੋਬਾਰ ਦੀਆਂ ਲੋੜਾਂ ਲਈ ਸ਼ਿਸ਼ੂ, ਕਿਸ਼ੋਰ ਅਤੇ ਤਰੁਣ ਸ਼੍ਰੇਣੀਆਂ ਵਿੱਚ ਬਿਨਾਂ ਗਰੰਟੀ ਕਰਜ਼ਾ।"],
      e:["Non-farm small business owners and entrepreneurs.","गैर-कृषि छोटे व्यापारी और उद्यमी।","बिगर-शेती लहान व्यावसायिक व उद्योजक.","অ-কৃষি ছোট ব্যবসায়ী ও উদ্যোক্তা।","விவசாயம் அல்லாத சிறு தொழில் முனைவோர்.","వ్యవసాయేతర చిన్న వ్యాపారులు, పారిశ్రామికవేత్తలు.","બિન-ખેતી નાના વેપારીઓ અને ઉદ્યોગસાહસિકો.","ಕೃಷಿಯೇತರ ಸಣ್ಣ ವ್ಯಾಪಾರಿಗಳು ಮತ್ತು ಉದ್ಯಮಿಗಳು.","കാർഷികേതര ചെറുകിട ബിസിനസുകാരും സംരംഭകരും.","ਗੈਰ-ਖੇਤੀ ਛੋਟੇ ਕਾਰੋਬਾਰੀ ਅਤੇ ਉੱਦਮੀ।"] },

    { name:"National Scholarship Portal", cat:"education", st:"all", link:"https://scholarships.gov.in/",
      d:["aadhaar","bank","marks","income"],
      b:["Scholarships for school and college students, applied for on one online portal.","स्कूल और कॉलेज के विद्यार्थियों के लिए छात्रवृत्ति, एक ही ऑनलाइन पोर्टल से आवेदन।","शाळा व महाविद्यालयीन विद्यार्थ्यांसाठी शिष्यवृत्ती, एकाच ऑनलाइन पोर्टलवरून अर्ज.","স্কুল ও কলেজের শিক্ষার্থীদের জন্য বৃত্তি, একটি অনলাইন পোর্টালে আবেদন।","பள்ளி, கல்லூரி மாணவர்களுக்கு உதவித்தொகை, ஒரே ஆன்லைன் தளத்தில் விண்ணப்பம்.","పాఠశాల, కళాశాల విద్యార్థులకు స్కాలర్‌షిప్‌లు, ఒకే ఆన్‌లైన్ పోర్టల్‌లో దరఖాస్తు.","શાળા અને કોલેજના વિદ્યાર્થીઓ માટે શિષ્યવૃત્તિ, એક જ ઓનલાઇન પોર્ટલ પર અરજી.","ಶಾಲಾ ಮತ್ತು ಕಾಲೇಜು ವಿದ್ಯಾರ್ಥಿಗಳಿಗೆ ವಿದ್ಯಾರ್ಥಿವೇತನ, ಒಂದೇ ಆನ್‌ಲೈನ್ ಪೋರ್ಟಲ್‌ನಲ್ಲಿ ಅರ್ಜಿ.","സ്കൂൾ, കോളേജ് വിദ്യാർത്ഥികൾക്ക് സ്കോളർഷിപ്പ്, ഒരൊറ്റ ഓൺലൈൻ പോർട്ടലിൽ അപേക്ഷ.","ਸਕੂਲ ਅਤੇ ਕਾਲਜ ਦੇ ਵਿਦਿਆਰਥੀਆਂ ਲਈ ਵਜ਼ੀਫ਼ਾ, ਇੱਕੋ ਔਨਲਾਈਨ ਪੋਰਟਲ 'ਤੇ ਅਰਜ਼ੀ।"],
      e:["Differs by scholarship; check each one.","हर छात्रवृत्ति के अनुसार अलग; हर एक देखें।","शिष्यवृत्तीनुसार वेगळी; प्रत्येक तपासा.","বৃত্তি অনুযায়ী আলাদা; প্রতিটি দেখুন।","உதவித்தொகைக்கு ஏற்ப மாறும்; ஒவ்வொன்றையும் பார்க்கவும்.","స్కాలర్‌షిప్‌ను బట్టి మారుతుంది; ఒక్కొక్కటి చూడండి.","શિષ્યવૃત્તિ મુજબ અલગ; દરેક તપાસો.","ವಿದ್ಯಾರ್ಥಿವೇತನದ ಪ್ರಕಾರ ಬೇರೆ; ಪ್ರತಿಯೊಂದನ್ನೂ ಪರಿಶೀಲಿಸಿ.","സ്കോളർഷിപ്പ് അനുസരിച്ച് വ്യത്യാസം; ഓരോന്നും പരിശോധിക്കുക.","ਵਜ਼ੀਫ਼ੇ ਅਨੁਸਾਰ ਵੱਖਰੀ; ਹਰ ਇੱਕ ਦੇਖੋ।"] },

    { name:"PM Vishwakarma", cat:"skill", st:"all", link:"https://pmvishwakarma.gov.in/",
      d:["aadhaar","bank","trade","mobile"],
      b:["Skill training, toolkit support and easy credit for traditional artisans.","पारंपरिक कारीगरों को कौशल प्रशिक्षण, टूलकिट सहायता और आसान ऋण।","पारंपरिक कारागिरांना कौशल्य प्रशिक्षण, टूलकिट मदत व सुलभ कर्ज.","ঐতিহ্যবাহী কারিগরদের দক্ষতা প্রশিক্ষণ, টুলকিট সহায়তা ও সহজ ঋণ।","பாரம்பரிய கைவினைஞர்களுக்குத் திறன் பயிற்சி, கருவித் தொகுப்பு உதவி, எளிய கடன்.","సాంప్రదాయ చేతివృత్తి వారికి నైపుణ్య శిక్షణ, టూల్‌కిట్ సాయం, సులభ రుణం.","પરંપરાગત કારીગરોને કૌશલ્ય તાલીમ, ટૂલકિટ સહાય અને સરળ લોન.","ಸಾಂಪ್ರದಾಯಿಕ ಕುಶಲಕರ್ಮಿಗಳಿಗೆ ಕೌಶಲ್ಯ ತರಬೇತಿ, ಟೂಲ್‌ಕಿಟ್ ನೆರವು, ಸುಲಭ ಸಾಲ.","പരമ്പരാഗത കരകൗശല തൊഴിലാളികൾക്ക് നൈപുണ്യ പരിശീലനം, ടൂൾകിറ്റ് സഹായം, എളുപ്പ വായ്പ.","ਰਵਾਇਤੀ ਕਾਰੀਗਰਾਂ ਨੂੰ ਹੁਨਰ ਸਿਖਲਾਈ, ਟੂਲਕਿੱਟ ਸਹਾਇਤਾ ਅਤੇ ਆਸਾਨ ਕਰਜ਼ਾ।"],
      e:["Artisans in the listed traditional trades.","सूचीबद्ध पारंपरिक व्यवसायों के कारीगर।","यादीतील पारंपरिक व्यवसायांचे कारागीर.","তালিকাভুক্ত ঐতিহ্যবাহী পেশার কারিগর।","பட்டியலிடப்பட்ட பாரம்பரிய தொழில்களின் கைவினைஞர்கள்.","జాబితాలోని సాంప్రదాయ వృత్తుల చేతివృత్తి వారు.","યાદીમાંના પરંપરાગત વ્યવસાયોના કારીગરો.","ಪಟ್ಟಿಯಲ್ಲಿರುವ ಸಾಂಪ್ರದಾಯಿಕ ವೃತ್ತಿಗಳ ಕುಶಲಕರ್ಮಿಗಳು.","പട്ടികയിലുള്ള പരമ്പരാഗത തൊഴിലുകളിലെ കരകൗശലക്കാർ.","ਸੂਚੀਬੱਧ ਰਵਾਇਤੀ ਕਿੱਤਿਆਂ ਦੇ ਕਾਰੀਗਰ।"] },

    { name:"Skill India Digital", cat:"skill", st:"all", link:"https://www.skillindiadigital.gov.in/",
      d:["aadhaar","mobile"],
      b:["Skill courses with certificates that help in getting a job or starting work.","प्रमाणपत्र वाले कौशल कोर्स, जो नौकरी पाने या काम शुरू करने में मदद करते हैं।","प्रमाणपत्रासह कौशल्य अभ्यासक्रम, जे नोकरी मिळवण्यास किंवा काम सुरू करण्यास मदत करतात.","সার্টিফিকেটসহ দক্ষতা কোর্স, যা চাকরি পেতে বা কাজ শুরু করতে সাহায্য করে।","சான்றிதழுடன் கூடிய திறன் படிப்புகள், வேலை பெற அல்லது தொழில் தொடங்க உதவும்.","సర్టిఫికెట్‌తో నైపుణ్య కోర్సులు, ఉద్యోగం పొందడానికి లేదా పని ప్రారంభించడానికి సహాయపడతాయి.","પ્રમાણપત્ર સાથેના કૌશલ્ય અભ્યાસક્રમો, જે નોકરી મેળવવા કે કામ શરૂ કરવામાં મદદ કરે છે.","ಪ್ರಮಾಣಪತ್ರದೊಂದಿಗೆ ಕೌಶಲ್ಯ ಕೋರ್ಸ್‌ಗಳು, ಉದ್ಯೋಗ ಪಡೆಯಲು ಅಥವಾ ಕೆಲಸ ಆರಂಭಿಸಲು ಸಹಾಯಕ.","സർട്ടിഫിക്കറ്റുള്ള നൈപുണ്യ കോഴ്സുകൾ, ജോലി നേടാനോ സംരംഭം തുടങ്ങാനോ സഹായിക്കും.","ਸਰਟੀਫਿਕੇਟ ਵਾਲੇ ਹੁਨਰ ਕੋਰਸ, ਜੋ ਨੌਕਰੀ ਲੈਣ ਜਾਂ ਕੰਮ ਸ਼ੁਰੂ ਕਰਨ ਵਿੱਚ ਮਦਦ ਕਰਦੇ ਹਨ।"],
      e:["Any Indian citizen.","कोई भी भारतीय नागरिक।","कोणताही भारतीय नागरिक.","যেকোনো ভারতীয় নাগরিক।","எந்த இந்தியக் குடிமகனும்.","ఏ భారతీయ పౌరుడైనా.","કોઈપણ ભારતીય નાગરિક.","ಯಾವುದೇ ಭಾರತೀಯ ನಾಗರಿಕ.","ഏതൊരു ഇന്ത്യൻ പൗരനും.","ਕੋਈ ਵੀ ਭਾਰਤੀ ਨਾਗਰਿਕ।"] },

    { name:"Atal Pension Yojana", cat:"pension", st:"all", link:"https://www.jansuraksha.gov.in/",
      d:["aadhaar","bank","mobile"],
      b:["A fixed monthly pension after age 60, based on the amount you contribute.","60 वर्ष के बाद आपके योगदान के अनुसार तय मासिक पेंशन।","६० वर्षांनंतर तुमच्या योगदानानुसार ठरावीक मासिक पेन्शन.","৬০ বছরের পর আপনার জমার ওপর ভিত্তি করে নির্দিষ্ট মাসিক পেনশন।","60 வயதுக்குப் பின் நீங்கள் செலுத்தும் தொகைக்கு ஏற்ப நிலையான மாதாந்திர ஓய்வூதியம்.","60 ఏళ్ల తర్వాత మీరు చెల్లించిన మొత్తం ఆధారంగా నిర్ణీత నెలవారీ పెన్షన్.","૬૦ વર્ષ પછી તમારા યોગદાન મુજબ નક્કી માસિક પેન્શન.","60 ವರ್ಷದ ನಂತರ ನಿಮ್ಮ ಕೊಡುಗೆಯ ಆಧಾರದ ಮೇಲೆ ನಿಗದಿತ ಮಾಸಿಕ ಪಿಂಚಣಿ.","60 വയസ്സിനുശേഷം നിങ്ങൾ അടയ്ക്കുന്ന തുക അനുസരിച്ച് നിശ്ചിത പ്രതിമാസ പെൻഷൻ.","60 ਸਾਲ ਤੋਂ ਬਾਅਦ ਤੁਹਾਡੇ ਯੋਗਦਾਨ ਅਨੁਸਾਰ ਤੈਅ ਮਾਸਿਕ ਪੈਨਸ਼ਨ।"],
      e:["Bank account holder aged 18-40.","18-40 वर्ष का बैंक खाताधारक।","१८-४० वर्षांचा बँक खातेदार.","১৮-৪০ বছরের ব্যাংক অ্যাকাউন্টধারী।","18-40 வயது வங்கிக் கணக்கு உள்ளவர்.","18-40 ఏళ్ల బ్యాంక్ ఖాతాదారు.","૧૮-૪૦ વર્ષનો બેંક ખાતાધારક.","18-40 ವರ್ಷದ ಬ್ಯಾಂಕ್ ಖಾತೆದಾರ.","18-40 വയസ്സുള്ള ബാങ്ക് അക്കൗണ്ട് ഉടമ.","18-40 ਸਾਲ ਦਾ ਬੈਂਕ ਖਾਤਾ ਧਾਰਕ।"] },

    { name:"Stand-Up India", cat:"business", st:"all", link:"https://www.standupmitra.in/",
      d:["aadhaar","pan","caste","business","bank"],
      b:["Bank loan for setting up a new enterprise in manufacturing, services or trading.","विनिर्माण, सेवा या व्यापार में नया उद्यम शुरू करने के लिए बैंक ऋण।","उत्पादन, सेवा किंवा व्यापारात नवीन उद्योग सुरू करण्यासाठी बँक कर्ज.","উৎপাদন, পরিষেবা বা ব্যবসায় নতুন উদ্যোগ শুরু করতে ব্যাংক ঋণ।","உற்பத்தி, சேவை அல்லது வர்த்தகத்தில் புதிய நிறுவனம் தொடங்க வங்கிக் கடன்.","తయారీ, సేవలు లేదా వ్యాపారంలో కొత్త సంస్థ ప్రారంభించడానికి బ్యాంక్ రుణం.","ઉત્પાદન, સેવા કે વેપારમાં નવો ઉદ્યોગ શરૂ કરવા માટે બેંક લોન.","ತಯಾರಿಕೆ, ಸೇವೆ ಅಥವಾ ವ್ಯಾಪಾರದಲ್ಲಿ ಹೊಸ ಉದ್ಯಮ ಆರಂಭಿಸಲು ಬ್ಯಾಂಕ್ ಸಾಲ.","ഉൽപ്പാദനം, സേവനം, വ്യാപാരം എന്നിവയിൽ പുതിയ സംരംഭം തുടങ്ങാൻ ബാങ്ക് വായ്പ.","ਨਿਰਮਾਣ, ਸੇਵਾ ਜਾਂ ਵਪਾਰ ਵਿੱਚ ਨਵਾਂ ਉੱਦਮ ਸ਼ੁਰੂ ਕਰਨ ਲਈ ਬੈਂਕ ਕਰਜ਼ਾ।"],
      e:["SC/ST or women entrepreneurs (new enterprise).","SC/ST या महिला उद्यमी (नया उद्यम)।","SC/ST किंवा महिला उद्योजक (नवीन उद्योग).","SC/ST বা মহিলা উদ্যোক্তা (নতুন উদ্যোগ)।","SC/ST அல்லது பெண் தொழில்முனைவோர் (புதிய நிறுவனம்).","SC/ST లేదా మహిళా పారిశ్రామికవేత్తలు (కొత్త సంస్థ).","SC/ST અથવા મહિલા ઉદ્યોગસાહસિક (નવો ઉદ્યોગ).","SC/ST ಅಥವಾ ಮಹಿಳಾ ಉದ್ಯಮಿ (ಹೊಸ ಉದ್ಯಮ).","SC/ST അല്ലെങ്കിൽ വനിതാ സംരംഭകർ (പുതിയ സംരംഭം).","SC/ST ਜਾਂ ਮਹਿਲਾ ਉੱਦਮੀ (ਨਵਾਂ ਉੱਦਮ)।"] },

    // ---- State schemes ----
    { name:"Majhi Ladki Bahin Yojana", cat:"women", st:"MH", link:"https://ladakibahin.maharashtra.gov.in/",
      d:["aadhaar","domicile","income","bank","photo"], b:MONTHLY,
      e:["Eligible women of Maharashtra within the income limit.","आय सीमा के भीतर महाराष्ट्र की पात्र महिलाएँ।","उत्पन्न मर्यादेतील महाराष्ट्रातील पात्र महिला.","আয়ের সীমার মধ্যে মহারাষ্ট্রের যোগ্য মহিলা।","வருமான வரம்புக்குள் மகாராஷ்டிராவின் தகுதியான பெண்கள்.","ఆదాయ పరిమితి లోపు మహారాష్ట్ర అర్హత గల మహిళలు.","આવક મર્યાદામાં મહારાષ્ટ્રની પાત્ર મહિલાઓ.","ಆದಾಯ ಮಿತಿಯೊಳಗಿನ ಮಹಾರಾಷ್ಟ್ರದ ಅರ್ಹ ಮಹಿಳೆಯರು.","വരുമാന പരിധിക്കുള്ളിലെ മഹാരാഷ്ട്രയിലെ യോഗ്യരായ സ്ത്രീകൾ.","ਆਮਦਨ ਸੀਮਾ ਅੰਦਰ ਮਹਾਰਾਸ਼ਟਰ ਦੀਆਂ ਯੋਗ ਔਰਤਾਂ।"] },

    { name:"Mukhyamantri Kanya Sumangala Yojana", cat:"women", st:"UP", link:"https://mksy.up.gov.in/",
      d:["aadhaar","birth","income","bank"],

  let L = 0; // current language index
  const $ = id => document.getElementById(id);
  const t = key => UI[key][L];

  function fillSelect(sel, firstLabel, entries) {
    const prev = sel.value || "all";
    sel.innerHTML = "";
    const first = document.createElement("option");
    first.value = "all"; first.textContent = firstLabel;
    sel.appendChild(first);
    entries.forEach(([val, label]) => {
      const o = document.createElement("option");
      o.value = val; o.textContent = label;
      sel.appendChild(o);
    });
    sel.value = prev;
  }

  function buildStaticText() {
    document.documentElement.lang = LANGS[L][0];
    $("title").textContent = t("title");
    $("subtitle").textContent = t("subtitle");
    $("search").placeholder = t("search");
    $("notice").textContent = t("notice");
    $("footer").textContent = t("footer");
    $("empty").textContent = t("none");
    fillSelect($("category"), t("allCat"), Object.keys(CATS).map(k => [k, CATS[k][L]]));
    fillSelect($("state"), t("allStates"), Object.keys(STATES).map(k => [k, STATES[k][L]]));
  }

  function copyText(text, btn) {
    const done = () => { btn.textContent = t("copied"); setTimeout(() => btn.textContent = t("copy"), 1500); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(() => window.prompt("Copy:", text));
    } else {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { window.prompt("Copy:", text); }
      ta.remove();
    }
  }

  function heading(text) { const h = document.createElement("h4"); h.textContent = text; return h; }
  function para(text) { const p = document.createElement("p"); p.textContent = text; return p; }

  function makeCard(s) {
    const card = document.createElement("div"); card.className = "card";

    const tags = document.createElement("div"); tags.className = "tags";
    const t1 = document.createElement("span"); t1.className = "tag"; t1.textContent = CATS[s.cat][L];
    const t2 = document.createElement("span"); t2.className = "tag state";
    t2.textContent = s.st === "all" ? t("central") : STATES[s.st][L];
    tags.append(t1, t2);

    const h = document.createElement("h3"); h.textContent = s.name;

    const tabs = document.createElement("div"); tabs.className = "tabs";
    const bFull = document.createElement("button"); bFull.textContent = t("tabFull");
    const bElig = document.createElement("button"); bElig.textContent = t("tabElig");
    const panel = document.createElement("div"); panel.className = "panel";

    function show(which) {
      panel.innerHTML = "";
      if (which === "full") {
        // Full tab: benefits + eligibility + documents required
        panel.append(heading(t("hBenefits")), para(s.b[L]));
        panel.append(heading(t("tabElig")), para(s.e[L]));
        panel.append(heading(t("hDocs")));
        const ul = document.createElement("ul");
        s.d.forEach(k => { const li = document.createElement("li"); li.textContent = DOCS[k][L]; ul.appendChild(li); });
        panel.append(ul);
      } else {
        panel.append(para(s.e[L]));
      }
      bFull.className = which === "full" ? "active" : "";
      bElig.className = which === "elig" ? "active" : "";
    }
    bFull.onclick = () => show("full");
    bElig.onclick = () => show("elig");
    tabs.append(bFull, bElig);
    show("full");

    const actions = document.createElement("div"); actions.className = "actions";
    const copy = document.createElement("button"); copy.className = "copy"; copy.textContent = t("copy");
    copy.onclick = () => copyText(s.link, copy);
    const open = document.createElement("a"); open.className = "apply"; open.href = s.link;
    open.target = "_blank"; open.rel = "noopener noreferrer"; open.textContent = t("open");
    actions.append(copy, open);

    card.append(tags, h, tabs, panel, actions);
    return card;
  }

  function render() {
    const q = $("search").value.trim().toLowerCase();
    const cat = $("category").value, st = $("state").value;
    const results = schemes.filter(s =>
      (cat === "all" || s.cat === cat) &&
      (st === "all" || s.st === "all" || s.st === st) &&
      (s.name + " " + s.b[L] + " " + CATS[s.cat][L]).toLowerCase().includes(q)
    );
    $("grid").innerHTML = "";
    results.forEach(s => $("grid").appendChild(makeCard(s)));
    $("empty").hidden = results.length > 0;
  }

  LANGS.forEach(([code, label], i) => {
    const o = document.createElement("option"); o.value = i; o.textContent = label;
    $("lang").appendChild(o);
  });
  $("lang").onchange = () => { L = Number($("lang").value); buildStaticText(); render(); };
  $("search").oninput = render;
  $("category").onchange = render;
  $("state").onchange = render;

  buildStaticText();
  render();
</script>
